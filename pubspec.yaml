name: strion
description: "Strion — Track your sessions. Climb the ranks."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.5.0
  firebase_analytics: ^11.3.0

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Google Sign-In
  google_sign_in: ^6.2.2

  # UI / Animations
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.16
  share_plus: ^10.1.4
  url_launcher: ^6.3.1

  # Utils
  intl: ^0.20.1
  uuid: ^4.5.1
  collection: ^1.18.0

  # Icons
  lucide_icons: ^0.257.0

  # Fonts via CDN (google_fonts has Dart 3.12 incompatibility)

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.2
  build_runner: ^2.4.13
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.2

flutter:
  uses-material-design: true
